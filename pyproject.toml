[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mystorax-conductor-mcp"
version = "3.0.0"
description = "Front-neutral MystoraX MCP and two-skill distribution package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MystoraX" }]
keywords = ["mystorax", "conductor", "mcp", "front-agnostic", "host-package"]
dependencies = []

[project.scripts]
mystorax-conductor-mcp = "mystorax_conductor_mcp.server:main"

[tool.setuptools.packages.find]
where = ["python"]
