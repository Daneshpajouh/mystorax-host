[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mystorax-conductor-mcp"
version = "2.0.1"
description = "Thin stdio MCP connector for the front-agnostic MystoraX host package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MystoraX" }]
keywords = ["mystorax", "conductor", "mcp", "front-agnostic", "host-package"]
dependencies = []

[project.scripts]
mystorax-conductor-mcp = "mystorax_conductor_mcp.server:main"

[tool.setuptools.packages.find]
where = ["python"]
