[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mystorax-conductor-mcp"
version = "1.3.0"
description = "Thin stdio MCP facade over MystoraX Conductor HTTP (front-agnostic)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MystoraX" }]
keywords = ["mystorax", "conductor", "mcp", "front-agnostic"]
dependencies = []

[project.scripts]
mystorax-conductor-mcp = "mystorax_conductor_mcp.server:main"

[tool.setuptools.packages.find]
where = ["python"]
