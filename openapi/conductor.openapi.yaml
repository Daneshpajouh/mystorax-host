openapi: 3.1.0
info:
  title: MystoraX Conductor
  version: "2.0.1"
  description: >
    Front-agnostic MystoraX Conductor HTTP source of truth. Fronts must call
    routing guide and surfaces before submitting a goal.
servers:
  - url: https://mx.parallex.ca
paths:
  /v1/hosts/manifest:
    get:
      operationId: getHostManifest
      summary: Bootstrap MystoraX hosts and discovery
      security: []
      responses:
        "200":
          description: Current host manifest
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/routing-guide:
    get:
      operationId: getRoutingGuide
      summary: Get MystoraX routing doctrine
      security: []
      responses:
        "200":
          description: Current routing guide
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/surfaces:
    get:
      operationId: listSurfaces
      summary: List MystoraX capability surfaces
      security: []
      responses:
        "200":
          description: Capability surface catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/hosts/mcp/tools:
    get:
      operationId: listMcpTools
      summary: List current Conductor MCP tool descriptors
      security: []
      responses:
        "200":
          description: Tool descriptors
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/hosts/mcp/tools/call:
    post:
      operationId: callMcpTool
      summary: Call a Conductor MCP tool through its HTTP twin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                arguments:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/goal:
    post:
      operationId: submitGoal
      summary: Submit a goal to MystoraX Conductor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Goal"
      responses:
        "200":
          description: Synchronous or completed result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Accepted durable job or wait
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/jobs/{job_id}/status:
    get:
      operationId: getJobStatus
      summary: Get durable job status
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/axiom/status:
    get:
      operationId: getAxiomStatus
      summary: Get MystoraX Science OS and Axiom readiness
      security: []
      responses:
        "200":
          description: Science OS status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/axiom/campaigns/{campaign_id}/resume:
    post:
      operationId: resumeScienceCampaign
      summary: Resume a bounded Science OS campaign
      description: Automatic progression must stop at EVIDENCE and never auto-CERTIFY.
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal:
                  type: string
                phase:
                  type: string
                max_phases:
                  type: integer
                  minimum: 1
                  default: 1
                max_auto_phase:
                  type: string
                  enum: [DEFINE, PLAN, DESIGN, EXECUTE, ANALYZE, EVIDENCE]
                  default: EVIDENCE
                effort:
                  type: string
                via:
                  type: string
                  default: cookie
      responses:
        "200":
          description: Campaign resume result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/axiom/mcp/tools/call:
    post:
      operationId: callAxiomTool
      summary: Call one allowlisted Axiom tool through Conductor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool:
                  type: string
                arguments:
                  type: object
                  additionalProperties: true
                timeout_s:
                  type: number
                  minimum: 1
                  default: 60
      responses:
        "200":
          description: Axiom tool result or fail-closed gate
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Goal:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        host:
          type: string
          default: openapi
        voice:
          type: boolean
          default: false
        job_class:
          type: string
          enum: [research, coding, planning, science, ops, voice_frontdoor]
          default: coding
        effort:
          type: string
          enum: [low, medium, high, xhigh]
        worker:
          type: string
        model:
          type: string
        mode:
          oneOf:
            - type: string
            - type: integer
        bridge_opts:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        dispatch:
          type: boolean
          default: true
        async_mode:
          type: boolean
